name: CI

# Makes the repository's local quality gates externally reproducible:
# typecheck, lint, unit tests, build — plus the Playwright smoke test
# and a separate blocking coverage run (`npm run test:coverage`).
# Deliberately minimal: no deployment, no release automation, no containers.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Dependency security. The blocking gate covers the tree that is
      # actually shipped: `npm audit --omit=dev` must find nothing (green
      # today). The retry exists because npm audit is a live registry call
      # and a transient network failure must not be reported as a
      # vulnerability — a real finding fails both attempts. The full-tree
      # report is deliberately non-blocking: the shadcn CLI chain still
      # carries one dev-only advisory with no fixed release yet
      # (braces <=3.0.3, GHSA-vfj7-8cjw-p6xm); it stays visible on every
      # run and documented in docs/architecture.md "Known tooling notes".
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev || npm audit --omit=dev
      - name: Report full-tree audit (non-blocking)
        run: npm audit
        continue-on-error: true
      - run: npm run typecheck
      - name: Typecheck E2E tests
        run: npm run typecheck:e2e
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Coverage gate (phase 30, docs/testing.md): a SEPARATE blocking job so
  # the instrumented vitest run neither competes for CPU with the ordinary
  # unit run in `gates` nor hides its failure behind another job's result.
  # It runs the repository's own `npm run test:coverage` unchanged (v8
  # provider; the script caps workers at 2, phase 29, so slow-instrumented
  # tests stay under the default per-test budget). The coverage summary
  # tables print directly into this job's log; no artifact upload (the
  # repository has no upload convention and coverage/ is gitignored).
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  e2e:
    name: E2E smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # NV-1 crash durability (phase 21, docs/testing.md): a SEPARATE job
  # because the test owns its browser-process lifecycle — it launches
  # and kills supervised Chromium processes against disposable
  # user-data directories (never the ordinary E2E browser profile).
  crash-durability:
    name: NV-1 crash durability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:crash
